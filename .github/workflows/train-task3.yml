# Trains the Task 3 CNN on EMNIST Letters on GitHub's servers and saves the
# results (charts, metrics, trained model) back into this repository.
# Run it again any time from the Actions tab > "Train Task 3" > Run workflow.
name: Train Task 3 (EMNIST letters)

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/train-task3.yml"

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: CodeAlpha_HandwrittenCharacterRecognition
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Train on EMNIST letters
        run: python src/train.py --epochs 15

      - name: Save results to the repository
        run: |
          rm -f models/README.txt results/README.txt images/README.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images results models
          git commit -m "Add Task 3 training results (EMNIST letters)"
          git push
